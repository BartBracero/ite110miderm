<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>Language Translator</h1>
            <p>A simple way to connect through language.</p>
        </header>

        <form class="translator" action="#" method="GET">
           
            <div class="language-row">
                <div class="language-box">
                    <label for="from-lang">Translate from</label>
                    <select id="from-lang" name="from_lang">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="tl">Tagalog</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>

                <div class="arrow">→</div>

                <div class="language-box">
                    <label for="to-lang">Translate to</label>
                    <select id="to-lang" name="to_lang">
                        <option value="tl">Tagalog</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>
            </div>

            
            <div class="text-section">
                <label for="source-text">Your text</label>
                <textarea
                    id="source-text"
                    name="source_text"
                    rows="5"
                    placeholder="Write something here..."
                ></textarea>
            </div>

            
            <div class="text-section">
                <label for="translated-text">Translation</label>
                <textarea
                    id="translated-text"
                    name="translated_text"
                    rows="5"
                    placeholder="Your translation will appear here..."
                    readonly
                ></textarea>
            </div>

            
            <button type="submit">Translate Text →</button>
        </form>

        <footer class="footer">
            Making communication easier, one word at a time.
        </footer>
    </main>

</body>
</html>
